name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Ectropy
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: ectropy

      - name: Install stable Plumb
        uses: PerishLab/actions/setup-binary@main
        env:
          PERISH_SETUP_PRODUCT: plumb

      - name: Guard
        run: |
          set -eu
          deno run --allow-all --config .runseal/deno.json .runseal/wrappers/guard.ts

      - name: sccache statistics
        if: ${{ always() }}
        run: sccache --show-stats

  guard-macos:
    runs-on: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Verify native detached jobs
        run: cargo test --locked -p api --test job -- --nocapture

      - name: sccache statistics
        if: ${{ always() }}
        run: sccache --show-stats
