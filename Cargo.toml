[workspace]
members = [
  "crates/api",
  "crates/santi",
  "crates/santi-api",
  "crates/santi-core",
  "crates/santi-error",
  "crates/santi-estate",
  "crates/santi-model",
  "crates/santi-object",
  "crates/santi-provider",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
plumb = { version = "0.4.0", registry = "perish" }
aes = "0.8.4"
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
bytes = "1.11.1"
cbc = { version = "0.1.2", features = ["alloc"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-core = "0.3.32"
futures-util = "0.3.32"
fs2 = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
jiff = "0.2.28"
keel = { version = "0.8.0", registry = "perish" }
libc = "0.2.180"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
santi-api = { path = "crates/santi-api" }
santi-core = { path = "crates/santi-core" }
santi-error = { path = "crates/santi-error" }
santi-estate = { path = "crates/santi-estate" }
santi-model = { path = "crates/santi-model" }
santi-object = { path = "crates/santi-object" }
santi-provider = { path = "crates/santi-provider" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rust-embed = "8.7.2"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.18"
toml = "1.1.2"
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
uuid = { version = "1.23.3", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
