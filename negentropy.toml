[scan]
include = [
  "crates/**/*.rs",
  "web/**/*.ts",
  "web/**/*.tsx",
  "web/**/*.scss",
]
exclude = [
  "**/target/**",
  "web/node_modules/**",
  "web/dist/**",
]

[module]
roots = [
  "crates/*/src",
  "crates/*/tests",
  "web/src",
  "web/tests",
]

[limit]
block = 4
path = 4
param = 4
markup = 8

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "test"
paths = [
  "crates/*/tests/**/*.rs",
  "web/tests/**/*.test.ts",
  "web/tests/**/*.test.tsx",
]

[[grant]]
syntax = "style"
paths = ["web/src/components/**"]

[[boundary]]
paths = [
  "web/vite.config.ts",
  "web/vitest.config.ts",
]
note = "vite and vitest require root-level config files; path law anchors to src and tests"
allow = ["path"]

[[boundary]]
paths = ["crates/santi-api/build.rs"]
note = "cargo build scripts must live at the crate root; path law anchors to src and tests"
allow = ["path"]
