[comment]
allow = false

[[grant]]
paths = [
  "crates/*/tests/**/*.rs",
]
syntax = "test"

[[grant]]
paths = [
  "crates/*/tests/**/*.rs",
  "crates/api/src/config.rs",
  "crates/santi-api/src/config/profile.rs",
  "crates/santi-api/src/jobs/**/*.rs",
  "crates/santi-core/src/environment.rs",
  "crates/santi-core/src/service/tools/environ.rs",
  "crates/santi/src/config.rs",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 4

[module]
roots = [
  "crates/*/src",
  "crates/*/tests",
]

[scan]
exclude = ["**/target/**"]
include = ["crates/**/*.rs"]

