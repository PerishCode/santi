name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: docker
    container: mirror.perish.lan/ci/deno
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned Negentropy
        run: |
          set -eu
          curl -fsSL https://releases.negentropy.perish.uk/manage.sh -o "$RUNNER_TEMP/manage-negentropy.sh"
          sh "$RUNNER_TEMP/manage-negentropy.sh" install --channel stable --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Guard
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"
          deno run --allow-all --config .runseal/deno.json .runseal/wrappers/guard.ts

      - name: sccache statistics
        if: ${{ always() }}
        run: sccache --show-stats

  guard-macos:
    runs-on: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Verify native detached jobs
        run: cargo test --locked -p api --test job -- --nocapture

      - name: sccache statistics
        if: ${{ always() }}
        run: sccache --show-stats
