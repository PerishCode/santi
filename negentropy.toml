[scan]
include = [
  "crates/**/*.rs",
]
exclude = [
  "**/target/**",
]

[module]
roots = [
  "crates/*/src",
  "crates/*/tests",
]

[limit]
block = 4
path = 4
param = 4
markup = 8

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "test"
paths = [
  "crates/*/tests/**/*.rs",
]




[[boundary]]
paths = [
  "crates/santi-api/src/server",
  "crates/santi-core/src/store",
  "crates/santi-core/src/service",
  "crates/santi-core/tests/service",
  "crates/santi-adaptor/src/db",
]
note = "temporary: dirs under active crate-split decomposition; fanout exemption dropped per-dir as each is fixed. file-length stays enforced."
allow = ["fanout"]

[[boundary]]
paths = ["crates"]
note = "structural: the crate-split deliberately decomposes santi into many small crates; the workspace crate list exceeds the per-directory fanout limit by design. file-length stays enforced."
allow = ["fanout"]
