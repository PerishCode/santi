[scan]
include = [
  "crates/**/*.rs",
]
exclude = [
  "**/target/**",
]

[module]
roots = [
  "crates/*/src",
  "crates/*/tests",
]

[limit]
block = 4
path = 4
param = 4
markup = 8

[comment]
allow = false

[word]
single = true

[[grant]]
syntax = "test"
paths = [
  "crates/*/tests/**/*.rs",
]

[[grant]]
syntax = "environment"
paths = [
    "crates/api/src/config.rs",
    "crates/santi-api/src/jobs/**/*.rs",
    "crates/santi-api/src/config/profile.rs",
  "crates/santi/src/config.rs",
  "crates/*/tests/**/*.rs",
]
