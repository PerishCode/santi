name: release-stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version
        required: true
        type: string
      promotion_channel:
        description: Exact source channel
        required: true
        default: beta
        type: string
      promotion_version:
        description: Exact source version
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: PerishLab/actions/.forgejo/workflows/release-binary.yml@main
    with:
      channel: stable
      version: ${{ inputs.version }}
      promotion_channel: ${{ inputs.promotion_channel }}
      promotion_version: ${{ inputs.promotion_version }}
    secrets:
      publish_access: ${{ secrets.RELEASE_PUBLISH_S3_ACCESS_KEY }}
      publish_secret: ${{ secrets.RELEASE_PUBLISH_S3_SECRET_KEY }}
      publish_bucket: ${{ secrets.RELEASE_PUBLISH_S3_BUCKET }}
      publish_endpoint: ${{ secrets.RELEASE_PUBLISH_S3_ENDPOINT }}
      activate_access: ${{ secrets.RELEASE_ACTIVATE_S3_ACCESS_KEY }}
      activate_secret: ${{ secrets.RELEASE_ACTIVATE_S3_SECRET_KEY }}
      activate_bucket: ${{ secrets.RELEASE_ACTIVATE_S3_BUCKET }}
      activate_endpoint: ${{ secrets.RELEASE_ACTIVATE_S3_ENDPOINT }}
      registry_token: ${{ secrets.RELEASE_REGISTRY_TOKEN }}
