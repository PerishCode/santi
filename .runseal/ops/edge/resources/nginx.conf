# window nginx — the read-only audit surface's front.
#
# Serves the static panel at / and BARE-proxies its data reads to santi on
# 127.0.0.1 (santi is auth-free and bound to loopback; NO bearer is injected).
# Public access is normally gated upstream by authentik forward-auth at the
# traefik IngressRoute. The exact downstream data paths bypass authentik and
# carry santi's zone credential; this nginx preserves it without interpreting it.
#
# Read/write split (the glass wall): forward-auth lets both humans (SSO cookie)
# and the machine (a client_credentials JWT in Authorization: Bearer) reach us.
# Reads (GET/HEAD) are open to either; write methods require the Bearer path, so
# a human viewer can SEE but not mutate. Webhook ingest is exempt (external
# callers carry no bearer; santi verifies the per-subscription signature). The
# exact downstream paths are also exempt because santi verifies their Bearer and
# applies zone authorization itself.
#
# Runs as a hostNetwork pod so it can reach santi at 127.0.0.1 and bind the
# node's private cni0 gateway (10.42.0.1 — pod-reachable by traefik, NOT routable
# from the internet) plus loopback. Mounted at /etc/nginx/conf.d/default.conf, so
# the map blocks below sit in the http context (no envsubst — these are nginx
# variables, not env).

# the machine-uid map key below is a 64-char hash → doesn't fit the default bucket
map_hash_bucket_size 128;

map $request_method $is_write_method {
    default 1;
    GET     0;
    HEAD    0;
    OPTIONS 0;
}
# Machine (service-account) identity. authentik's outpost sets X-Authentik-Uid and
# traefik copies it onto the request (authResponseHeaders), overwriting any
# client-supplied value — so it is unforgeable. Humans (SSO cookie) get their own
# uid; only the santi-window-cli service account may write. A bearer-presence check
# is NOT enough: an authenticated human can pass forward-auth by cookie and still
# attach a bogus Authorization: Bearer, which nginx would otherwise honour.
# NOTE: update this uid if the santi-window-cli service account is ever recreated.
map $http_x_authentik_uid $is_machine {
    default                                                            0;
    "ba0ccb95150cb4b88c2c4188f0613282a97fd4bfbbd7edea7c359d11b3b1bdff" 1;
}

# The doorbell (window chat, Stage 2): exactly ONE human — the operator — may
# POST exactly ONE path (the window speech ingress below). Same unforgeable
# uid mechanism as the machine map. Deployment-injected; update on account
# recreation. Everything else about the wall is unchanged: humans still read,
# machines still operate.
map $http_x_authentik_uid $is_speaker {
    default                                                            0;
    "83d521da41a32cd69411f43bb3a16c77b0ae733057a8401afc217eaf8957bca1" 1;
}

# Browser state-change protection for the doorbell: a speech POST must arrive
# same-origin (Sec-Fetch-Site) or carry the exact public Origin. Absent/null
# origins are rejected — an authenticated cookie alone is not a CSRF defense.
map $http_origin $speech_origin {
    default                     0;
    "https://santi.liberte.top" 1;
}
map $http_sec_fetch_site $speech_site {
    default       0;
    "same-origin" 1;
}
map "$speech_origin$speech_site" $speech_browser {
    default 1;
    "00"    0;
}

server {
    listen 10.42.0.1:8088;
    listen 127.0.0.1:8088;
    server_name _;

    # The audit page. A projection surface; never cached stale.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # Webhook ingest — exempt from the write-split (GitHub/feishu POST with no
    # bearer; santi authenticates them by signature). This more-specific prefix
    # wins over /api/ below.
    location /api/v1/webhooks/ {
        proxy_pass http://127.0.0.1:43307;
        proxy_set_header Host $host;
    }

    location = /api/v1/ingest {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:43307;
        proxy_set_header Host $host;
    }

    location = /api/v1/turn-events {
        proxy_pass http://127.0.0.1:43307;
        proxy_set_header Host $host;
    }

    location = /api/v1/turn-events/stream {
        proxy_pass http://127.0.0.1:43307;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # The window speech ingress (the doorbell). Exact location wins over the
    # /api/ prefix below, so the human write-block never applies here; instead:
    # POST only, the single allowlisted speaker only, same-origin only, small
    # bodies only (santi's 16 KiB content check stays authoritative). The
    # message that arrives is participant CONTENT, never operator authority.
    location = /api/v1/window/im/send {
        client_max_body_size 32k;
        if ($request_method != POST) { return 405; }
        if ($is_speaker = 0)         { return 403; }
        if ($speech_browser = 0)     { return 403; }
        proxy_pass http://127.0.0.1:43307;
        proxy_set_header Host $host;
    }

    # Panel reads + machine ops. Reads open to any forward-auth'd identity;
    # writes require the machine (service-account) identity — humans → cookie →
    # read-only → 403.
    location /api/ {
        set $deny "";
        if ($is_write_method) { set $deny "W"; }
        if ($is_machine)      { set $deny "${deny}M"; }
        if ($deny = "W")      { return 403; }

        proxy_pass http://127.0.0.1:43307;
        proxy_set_header Host $host;
        # SSE: stream through, don't buffer, keep the connection open.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # W-B shadow mount (santi web re-platform): the embedded pane, reachable
    # for verification while the configmap pane keeps serving root. Reads pass
    # through the same forward-auth wall as everything else; no allowlist or
    # doorbell change. The origin answers 308 for the exact /panel path.
    # PAYLOAD NOTE: prefix /panel/ must never swallow /panel-old or /api.
    location = /panel {
        proxy_pass http://127.0.0.1:43307;
        proxy_set_header Host $host;
    }

    location /panel/ {
        proxy_pass http://127.0.0.1:43307;
        proxy_set_header Host $host;
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}
