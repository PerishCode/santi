name: guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install flavor
        run: |
          curl -fsSL https://flavor.perish.uk/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/flavor" --version

      - name: Repo guard
        run: flavor check --root . --config flavor.toml

  smoke:
    name: smoke (ubuntu-latest)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: santi-guard-v1
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0

      - name: Activate sccache wrapper
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  rust-matrix:
    name: rust (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: santi-guard-v1
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.16.0

      - name: Activate sccache wrapper
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --version

      - name: Start Windows sccache server
        if: runner.os == 'Windows'
        shell: bash
        run: |
          "$SCCACHE_PATH" --start-server

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace
